<!DOCTYPE html>
{% load static %}
<html lang="ar">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@00&display=swap" rel="stylesheet">
        <title>تصميم ثوبك</title>
        <link rel="stylesheet" href="../static/Main Static/css/styles.css">
    </head>
    <body class="container">
        <div class="hero-section" style="background-image: url('../static/Main Static/images/MainPage/Background.jpg');">
            <!-- صورة الخلفية الرئيسية -->
            <div class="overlay"></div>
            <div class="hero-content">
                <h4>ثوبك، تصميمك، اختيارك</h4>
                <h6>ثوبك يعكس هويتك</h6>
            </div>
        </div>
        
        <section class="steps-section">
            <h2 style="font-size: xxx-large;">صمم ثوبك بخطوات بسيطة</h2>
                <div class="steps-container">
                <div class="step">
                    <!-- صورة محاكي التصميم على الهاتف -->
                    <img src="../static/Main Static/images/MainPage/Phone.png" alt="إرسال التصميم">
                    <p>إرسال التصميم</p>
                </div>
                <div class="step">
                    <!-- صورة نسيج القماش -->
                    <img src="../static/Main Static/images/MainPage/Cloth.jpg" alt="أضف التفاصيل">
                    <p>أضف التفاصيل</p>
                </div>
                <div class="step">
                    <!-- صورة أدوات التصميم والورق -->
                    <img src="../static/Main Static/images/MainPage/Papers.png" alt="اختر التصميم">
                    <p>اختر التصميم</p>
                </div>
            </div>
        </section>
        
        <hr style="border: none; border-top: 1px solid lightgray;">

        <section class="description-section">
            <div class="description-text">
                <p>حيث يمكنك تصميم ثوبك السعودي الخاص، نقدم لك فرصة اختيار التصميم ليعكس أسلوبك الشخصي. اجعل ثوبك فريداً ومخصصاً لك.</p>
            </div>
            <!-- صورة رجل يرتدي الثوب -->
            <div class="description-image">
                <img src="../static/Main Static/images/MainPage/Man.png" alt="ثوب سعودي">
            </div>
        </section>

        <hr style="border: none; border-top: 1px solid lightgray;">
                
        <a class="BUTTON" href="/design" style="text-decoration: none;"><button>صمم ثوبك</button></a>


    </body>

    <script src="../static/Main Static/js/script.js"></script>

</html>
